name: Offline validation

on: [push, pull_request]

jobs:
  core:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TMPDIR: ${{ github.workspace }}/.scratch/ci/tmp
      SLURM_TMPDIR: ${{ github.workspace }}/.scratch/ci/tmp
      XDG_CACHE_HOME: ${{ github.workspace }}/.scratch/ci/cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: mkdir -p "$TMPDIR"
      - name: Check production audio-cropping dependencies
        run: |
          python -m venv .scratch/ci/runtime
          .scratch/ci/runtime/bin/python -m pip install -r requirements/core.txt
          .scratch/ci/runtime/bin/python -m unittest tests.test_track2.Track2RuntimeTests.test_query_crops_are_mono_16khz
      - run: python -m pip install -r requirements/test.txt
      - run: python -m unittest discover -s tests
      - run: python scripts/smoke_test.py
      - run: python scripts/verify_datasets.py --audio --group synthetic
      - run: python scripts/check_release.py
